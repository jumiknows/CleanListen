name: Bug
description: Report a reproducible extraction, classification, or CLI problem.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and a public or synthetic example when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
    validations:
      required: true
